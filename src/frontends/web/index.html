<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico">
<title>z-agent-core</title>
<!-- STYLES -->
</head>
<body>
<div id="sidebar">
  <div id="sidebar-header">
    <h1>z-agent-core</h1>
    <div class="subtitle">AI-powered agent</div>
  </div>
  <button id="theme-btn" title="Toggle theme">&#9728;</button>
  <button id="new-session-btn">+ New Session</button>
  <div id="session-list"></div>
  <div id="model-selector">
    <select id="model-select" aria-label="Model"></select>
  </div>
  <div id="resize-handle"></div>
</div>
<div id="main">
  <div id="topbar"><span id="sidebar-toggle">&#9776;</span> z-agent-core</div>
  <div id="messages">
    <div id="system-prompt" style="display:none"></div>
  </div>
  <div id="input-bar">
    <textarea id="prompt-input" rows="1" placeholder="Enter a prompt... (Shift+Enter for new line)"></textarea>
    <button id="stop-btn" class="stop-btn" disabled>Stop</button>
    <button id="send-btn">Send</button>
  </div>
</div>
<div id="confirm-modal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-msg" id="confirm-msg"></div>
    <div class="modal-actions">
      <button class="modal-cancel">Cancel</button>
      <button class="modal-danger" id="confirm-ok">Delete</button>
    </div>
  </div>
</div>
<!-- SCRIPTS -->
</body>
</html>
